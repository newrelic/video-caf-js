name: CDN Integrity Monitor

# Periodically verifies that the files on the CDN match the artifacts in the
# latest GitHub Release. Alerts via a failed workflow run if they diverge.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours, offset to avoid simultaneous runs with other trackers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-integrity:
    name: Check CDN vs Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Run CDN integrity check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/cdn-integrity-monitor.mjs
