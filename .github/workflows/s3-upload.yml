name: S3 Upload

# Manually uploads a specific release version to S3.
# Use this when:
#   - The S3 upload failed during an automated release
#   - A specific version needs to be re-deployed to S3
#
# This workflow checks out the specified release tag (or master), rebuilds
# the project, uploads both the versioned and latest files to S3, and
# verifies the upload against the built artifact.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to upload (e.g. v5.0.1). Leave empty to use master.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  upload:
    name: Upload to S3
    environment: s3-publish
    uses: newrelic/video-core-js/.github/workflows/s3-upload.yml@620928f431a7f58f3fa1c5496fe079211929620a # master
    with:
      release-tag: ${{ inputs.release-tag }}
      s3-path: 'media-agents/browser/caf'
      enable-s3-upload: true
    secrets: inherit
